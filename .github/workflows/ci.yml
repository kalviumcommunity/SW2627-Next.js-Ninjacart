name: CI - Lint, Build & Test Check

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  backend-checks:
    name: Backend CI Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ninjacart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/ninjacart_test"
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Provide a fallback JWT_SECRET for CI test runs if the repository secret is missing.
      # This ensures tests don't crash with "JWT_SECRET environment variable is not configured"
      - name: Provide fallback JWT_SECRET for tests
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "JWT_SECRET=ci-test-jwt-secret-do-not-use" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Run Database Migrations
        run: npx prisma migrate deploy

      - name: Run Backend Tests
        run: npm test && npm run test:catalogue && npm run test:concurrency && npm run test:filter

  frontend-checks:
    name: Frontend CI Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
